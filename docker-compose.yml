services:
  db:
    image: postgres:16-alpine
    container_name: reportforge_db
    environment:
      POSTGRES_DB: reportforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reportforge_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reportforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reportforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reportforge_web
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-reportforge-super-secret-key-change-in-production}
      ALLOWED_HOSTS: "*"
      DB_NAME: reportforge
      DB_USER: postgres
      DB_PASSWORD: reportforge_password
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REPORTFORGE_STORAGE_BACKEND: local
      REPORTFORGE_STORAGE_DIR: /app/media/reports
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://127.0.0.1:8000,http://localhost,http://127.0.0.1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - static_volume:/app/static_collected
      - media_volume:/app/media

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reportforge_worker
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=4
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-reportforge-super-secret-key-change-in-production}
      DB_NAME: reportforge
      DB_USER: postgres
      DB_PASSWORD: reportforge_password
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REPORTFORGE_STORAGE_BACKEND: local
      REPORTFORGE_STORAGE_DIR: /app/media/reports
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://127.0.0.1:8000,http://localhost,http://127.0.0.1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - media_volume:/app/media

  nginx:
    image: nginx:alpine
    container_name: reportforge_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static_collected:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
