[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reportforge"
version = "2.0.0"
description = "Universal Document Engine and Fluent Report Builder SDK for Python with native Rust Core v2.0"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Edwin Abreu & ReportForge Contributors", email = "dev@reportforge.io" }
]
dependencies = [
    "requests>=2.28.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/reportforge/reportforge"
