[package]
name = "flowpdf"
version = "1.0.0"
edition = "2021"
authors = ["Edwin Abreu", "Felix R. Benzan", "FlowPDF Contributors"]
description = "Dominican open-source report and PDF generation engine in Rust (made in the Dominican Republic)"
license = "MIT"
repository = "https://github.com/CodePro47RD/FlowPDF"
readme = "README.md"
keywords = ["pdf", "report", "document", "barcode", "chart"]
categories = ["text-processing", "rendering"]
# Solo el código del motor: sin docs/, sdk/ ni binarios (límite de 10 MB en crates.io)
include = ["/src/**", "/tests/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
name = "flowpdf"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lopdf = { version = "0.33", default-features = false, features = ["nom_parser"] }
qrcode = { version = "0.14", default-features = false }
ttf-parser = "0.25.1"
base64 = "0.23.1"
png = { version = "0.18.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
